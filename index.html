<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Seasonal QR</title>
    <meta name="description" content="A seasonal 3D tree that unfolds into a real, scannable QR code. Runs in your browser; nothing is uploaded." />
    <meta property="og:title" content="Seasonal QR" />
    <meta property="og:description" content="A seasonal 3D tree that unfolds into a real, scannable QR code." />
    <meta name="theme-color" content="#f6f4ee" />
    <style>
      :root { --bg: #f6f4ee; --card: #fff; --ink: #1d1b17; --muted: #6b665c; --line: #e4dfd3; --accent: #8c1f52; --accent-soft: #f2a3b7; --radius: 16px; }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
      a { color: var(--accent); }
      header, main, footer { width: min(1120px, 100% - 32px); margin: 0 auto; }
      header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding: 28px 0 20px; }
      header h1 { margin: 0; font: 600 30px/1.1 "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; letter-spacing: -0.01em; }
      header h1 small { display: block; margin-top: 6px; font: 15px/1.4 system-ui, sans-serif; color: var(--muted); }
      header a { font-size: 14px; text-decoration: none; padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--card); color: var(--ink); }
      main { display: grid; gap: 24px; align-items: start; padding-bottom: 24px; }
      @media (min-width: 1000px) { main { grid-template-columns: auto 1fr; } .controls { position: sticky; top: 24px; } }
      .stage { justify-self: center; max-width: 100%; border-radius: var(--radius); overflow: hidden; box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 24px 48px -24px rgba(40,30,10,.35); background: var(--card); }
      .stage canvas { display: block; max-width: 100%; }
      .controls { display: flex; flex-direction: column; gap: 18px; padding: 24px; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); }
      .controls label, .field { display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: var(--muted); }
      .controls input:not([type='range']):not([type='checkbox']) { width: 100%; font: 16px/1.4 inherit; font-family: inherit; color: var(--ink); padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
      .controls input:focus-visible, .controls button:focus-visible, .controls a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      .hint { margin: 0; font-size: 13px; font-weight: 400; color: var(--muted); }
      .error { margin: -12px 0 0; min-height: 1.4em; font-size: 13px; font-weight: 500; color: #b00020; }
      .density { margin: 0; font-size: 13px; font-weight: 400; color: var(--muted); }
      .meter { display: flex; gap: 4px; }
      .meter span { flex: 1; height: 4px; border-radius: 2px; background: var(--line); }
      .meter span.active { background: var(--accent); }
      .seasons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 4px; background: var(--bg); border-radius: 10px; }
      .seasons button { padding: 8px 0; border: 0; border-radius: 7px; background: transparent; color: var(--muted); font: 600 13px/1 inherit; font-family: inherit; cursor: pointer; }
      .seasons button[aria-pressed='true'] { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
      .primary { padding: 14px; border: 0; border-radius: 12px; background: var(--accent); color: #fff; font: 600 16px/1 inherit; font-family: inherit; cursor: pointer; }
      .primary:hover { filter: brightness(1.1); }
      input[type='range'] { width: 100%; accent-color: var(--accent); margin: 0; }
      .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
      .actions a, .actions button { display: inline-flex; justify-content: center; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: var(--ink); font: 500 14px/1 inherit; font-family: inherit; text-decoration: none; cursor: pointer; }
      .actions a:hover, .actions button:hover { border-color: var(--ink); }
      .actions button:disabled { opacity: .6; cursor: progress; }
      .check { flex-direction: row !important; align-items: center; font-weight: 400 !important; }
      .check input { margin: 0; accent-color: var(--accent); }
      .loading { color: var(--muted); padding: 48px 0; text-align: center; }
      footer { padding: 24px 0 40px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); }
      footer p { margin: 0 0 4px; }
      .fallback { display: flex; flex-direction: column; gap: 12px; max-width: 480px; }
      .fallback img { width: 100%; max-width: 320px; image-rendering: pixelated; border-radius: 8px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
