<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Seasonal QR</title>
    <style>
      body { margin: 0; background: #fff; color: #1a1a1a; font: 14px/1.4 system-ui, sans-serif; }
      main { display: flex; flex-direction: column; gap: 12px; padding: 16px; }
      .controls { display: flex; flex-direction: column; gap: 8px; max-width: 640px; }
      .controls label { display: flex; gap: 8px; align-items: center; }
      .controls input:not([type='range']) { flex: 1; font: inherit; padding: 6px 8px; }
      .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
      .error { margin: 0; min-height: 1.4em; color: #b00020; }
      .density { margin: 0; color: #555; }
      header, footer { padding: 0 16px; max-width: 640px; }
      header h1 { margin: 16px 0 4px; font-size: 20px; }
      header p, footer p { margin: 0 0 4px; color: #555; }
      footer { margin: 12px 0 16px; font-size: 12px; }
      .meter { display: flex; gap: 4px; }
      .meter span { flex: 1; height: 4px; border-radius: 2px; background: #e0e0e0; }
      .meter span.active { background: #1a1a1a; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
